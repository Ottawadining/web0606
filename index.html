<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twelve</title>
<meta name="description" content="Twelve — Issue 01, September 2026.">
<link rel="canonical" href="https://twelve.menu/">
<meta property="og:type" content="website">
<meta property="og:title" content="Twelve">
<meta property="og:description" content="Twelve — Issue 01, September 2026.">
<meta property="og:image" content="https://twelve.menu/worth-travelling-hero.jpg">
<meta property="og:url" content="https://twelve.menu/">
<meta property="og:site_name" content="Twelve">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Twelve",
  "url": "https://twelve.menu/"
}
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  *{box-sizing:border-box; margin:0; padding:0;}

  :root{
    --white:#F7F4EC;
    --black:#0B0A08;
    --muted: rgba(11,10,8,0.55);
  }

  html, body{ height:100%; }

  body{
    background:var(--white);
    color:var(--black);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .cover{
    position:relative;
    height:100vh;
    width:100%;
    overflow:hidden;
  }

  .cover-photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .cover-scrim{
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom, rgba(11,10,8,0.22) 0%, transparent 22%, transparent 78%, rgba(11,10,8,0.35) 100%);
  }

  .cover-top{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:36px 32px;
    z-index:2;
  }

  .wordmark{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(14px, 1.8vw, 18px);
    letter-spacing:0.24em;
    color:var(--white);
    text-decoration:none;
  }

  .issue-tag{
    font-size:10px;
    font-weight:600;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--white);
    text-align:right;
    opacity:0.85;
    line-height:1.6;
  }

  .cover-bottom{
    position:absolute;
    bottom:0; left:0; right:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 24px 48px;
    z-index:2;
    text-align:center;
  }

  .cover-line{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(15px, 2.2vw, 19px);
    letter-spacing:0.02em;
    color:var(--white);
    text-decoration:none;
  }

  .enter-cue{
    margin-top:22px;
    width:1px;
    height:34px;
    background:rgba(247,244,236,0.55);
    animation:cue 2.2s ease-in-out infinite;
  }

  @keyframes cue{
    0%, 100% { opacity:0.3; transform:translateY(0); }
    50% { opacity:1; transform:translateY(6px); }
  }

  .cover-link{
    position:absolute;
    inset:0;
    z-index:3;
  }
</style>
</head>
<body>

<div class="cover">
  <img class="cover-photo" src="worth-travelling-hero.jpg" alt="">
  <div class="cover-scrim"></div>

  <div class="cover-top">
    <span class="wordmark">TWELVE</span>
    <span class="issue-tag">Issue 01<br>September 2026</span>
  </div>

  <div class="cover-bottom">
    <span class="cover-line">The September Issue</span>
    <div class="enter-cue"></div>
  </div>

  <a class="cover-link" href="september-2026.html" aria-label="Enter the issue"></a>
</div>

</body>
</html>
