<style>
  :root{
    --ivory:#F7F4EC;
    --ink:#0B0A08;
    --stone:#8A8073;
    --stone-soft:#B5AC9C;
    --hair:rgba(11,10,8,.14);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--ivory);color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none;}

  /* ——— minimal chrome, matching the article pages ——— */
  .head{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:1.35rem clamp(1.25rem,5vw,3rem);
  }
  .wordmark{font-family:"Fraunces",serif;font-weight:500;font-size:1.15rem;letter-spacing:.01em;}
  .issue-tag{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);}

  /* ——— masthead ——— */
  .masthead{
    padding:clamp(3rem,13vh,8rem) clamp(1.25rem,5vw,3rem) clamp(2.5rem,8vh,4.5rem);
    max-width:60rem;
  }
  .masthead .kicker{
    font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--stone);
    display:block;margin-bottom:clamp(1.25rem,4vh,2rem);
  }
  .masthead h1{
    font-family:"Fraunces",serif;font-weight:300;
    font-size:clamp(3rem,12vw,7rem);line-height:.9;letter-spacing:-.02em;margin:0;
  }
  .masthead .epigraph{
    font-family:"Fraunces",serif;font-style:italic;font-weight:400;color:var(--stone);
    font-size:clamp(1.05rem,1rem + 0.9vw,1.4rem);margin:clamp(1.5rem,5vh,2.5rem) 0 0;max-width:26ch;
  }

  /* ——— contents ——— */
  .contents{
    padding:0 clamp(1.25rem,5vw,3rem) clamp(4rem,12vh,7rem);
    max-width:60rem;
  }
  .toc{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair);}
  .toc li{border-bottom:1px solid var(--hair);}
  .toc a{
    display:grid;grid-template-columns:auto 1fr;column-gap:clamp(1rem,4vw,2.25rem);
    align-items:baseline;padding:clamp(1.5rem,4.5vh,2.4rem) 0;
  }
  .toc .num{
    font-family:"Fraunces",serif;font-weight:300;font-variant-numeric:lining-nums;
    font-size:clamp(1.6rem,6vw,2.3rem);color:var(--stone-soft);line-height:1;
    transition:color .25s ease;
  }
  .toc .dept{
    font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--stone);
    display:block;margin-bottom:.5rem;
  }
  .toc .title{
    font-family:"Fraunces",serif;font-weight:400;
    font-size:clamp(1.35rem,1rem + 2.2vw,2rem);line-height:1.12;letter-spacing:-.005em;
    display:block;width:fit-content;text-wrap:balance;
    background-image:linear-gradient(var(--ink),var(--ink));
    background-size:0% 1px;background-position:0 100%;background-repeat:no-repeat;
    transition:background-size .3s ease;
  }
  .toc a:hover .title,.toc a:focus-visible .title{background-size:100% 1px;}
  .toc a:hover .num,.toc a:focus-visible .num{color:var(--ink);}
  .toc a:focus-visible{outline:2px solid var(--ink);outline-offset:6px;}

  footer{padding:clamp(3rem,9vh,6rem) 0 clamp(2.5rem,7vh,4rem);text-align:center;}
  footer .mark{font-family:"Fraunces",serif;font-weight:400;font-size:.95rem;color:var(--stone);letter-spacing:.02em;}

  @media(prefers-reduced-motion:no-preference){
    .masthead .kicker,.masthead h1,.masthead .epigraph,.toc li{
      opacity:0;transform:translateY(12px);
      animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .masthead h1{animation-delay:.08s;}
    .masthead .epigraph{animation-delay:.32s;}
    .toc li:nth-child(1){animation-delay:.40s;}
    .toc li:nth-child(2){animation-delay:.48s;}
    .toc li:nth-child(3){animation-delay:.56s;}
    .toc li:nth-child(4){animation-delay:.64s;}
    @keyframes rise{to{opacity:1;transform:none;}}
  }
</style>
</head>
